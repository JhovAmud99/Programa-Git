<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta name="description" content="Prototipo web de red social - proyecto académico SENA ADSO">
        <title>Red Social | Iniciar sesión</title>
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body>
        <main class="auth-page">
            <section class="auth-card">
                <img class="auth-logo" src="img/logo.webp" alt="Logo Red Social">
                <h1>Iniciar sesión</h1>
                <p class="subtitle">Conecta, comparte y comunícate</p>
                <form id="loginForm">
                    <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input id="email" type="email" placeholder="usuario@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" placeholder="Mínimo 4 caracteres" minlength="4" required>
                </div>
                <button class="btn btn-primary full" type="submit">Iniciar sesión</button>
            </form>
            <div class="auth-links">¿No tienes cuenta? <a href="registro.html">Regístrate</a>
            </div>
            <p class="helper" style="text-align:center;margin-top:14px">Proyecto académico: acceso de demostración sin servidor.</p>
        </section>
    </main>
    
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <script src="js/script.js"></script>
    </body>
    </html>
