<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Prototipo web de red social - proyecto académico SENA ADSO">
    <title>Red Social | Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <main class="auth-page">
        <section class="auth-card"><img class="auth-logo" src="img/logo.svg" alt="Logo Red Social">
            <h1>Crear cuenta</h1>
            <p class="subtitle">Completa tus datos para registrarte</p>
            <form id="registerForm">
                <div class="form-group"><label for="nombre">Nombres</label><input id="nombre" required></div>
                <div class="form-group"><label for="apellido">Apellidos</label><input id="apellido" required></div>
                <div class="form-group"><label for="regEmail">Correo electrónico</label><input id="regEmail"
                        type="email" required></div>
                <div class="form-group"><label for="fecha">Fecha de nacimiento</label><input id="fecha" type="date"
                        required></div>
                <div class="form-group"><label for="regPassword">Contraseña</label><input id="regPassword"
                        type="password" minlength="4" required></div>
                <div class="form-group"><label for="confirmPassword">Confirmar contraseña</label><input
                        id="confirmPassword" type="password" minlength="4" required></div><button
                    class="btn btn-primary full" type="submit">Registrarme</button>
            </form>
            <div class="auth-links">¿Ya tienes cuenta? <a href="index.html">Iniciar sesión</a></div>
        </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="js/script.js"></script>
</body>

</html>
